        #PSR_Help_Intro = Abgetrennte, unbemannte Stufen landen von selbst: Fallschirme, Landetriebwerk, Landebeine, Aufsetzen, Bergung. Deine Rakete fliegt weiter wie immer.
        #PSR_Help_TrackedTitle = Welche Stufen übernommen werden
        #PSR_Help_Tracked = Jede abgetrennte, unbemannte Stufe in Reichweite um Kerbin, die noch geschlossene Fallschirme oder ein Landetriebwerk mit Treibstoff hat — höchstens <<1>> gleichzeitig. Sonst nennt das Fenster den Grund.
        #PSR_Help_ChutesTitle = Fallschirme
        #PSR_Help_Chutes = Schirme werden wenige Sekunden vorher scharfgeschaltet und spätestens in der Höhe geöffnet, die du unter Einstellungen einstellst (<<1>> über Grund) – fällt ein Booster schneller als ~250 m/s, öffnet er höher, rechtzeitig zum Abbremsen (bis 5 km). Ohne Hitzeschutz bleibt ein Schirm zu, den KSP für unsicher hält.
        #PSR_Help_PoweredTitle = Triebwerkslandung
        #PSR_Help_Powered = Der Landeautomat richtet den Booster rückwärts aus, bremst ihn mit dem Triebwerk und sinkt die letzten Meter sanft ab. Er braucht ein Kontrollmodul am Booster (z. B. eine Sonde), wiederzündbare Triebwerke und Lageregelung; Bremsklappen bleiben eingefahren.
        #PSR_Help_GearTitle = Landebeine und Bremsen
        #PSR_Help_Gear = Unter 1000 m über Grund fahren im Sinkflug die Landebeine aus, unter 10 m die Radbremsen.
        #PSR_Help_AutoStageTitle = Autostaging
        #PSR_Help_AutoStage = Autostaging trennt im Sinkflug ab der eingestellten Höhe bis zur eingestellten letzten Stufe — höchstens eine Stufe pro Sekunde. Deine Rakete wird dabei nie gestagt.
        #PSR_Help_RecoveryTitle = Bergung
        #PSR_Help_Recovery = Fallschirmlandungen werden bei Bodenkontakt geborgen, ohne Wartezeit; ein harter Aufprall zählt nicht als Landung. Eine Triebwerkslandung wird bewertet, wenn das Triebwerk knapp über dem Boden abschaltet. Ohne Auto-Bergung bleibt die Stufe stehen und lässt sich später von Hand bergen.
        #PSR_Help_WarpTitle = Während du fliegst
        #PSR_Help_Warp = Solange alle Booster über der Atmosphäre auf ihrer Bahn fliegen, geht der normale Zeitraffer; vor dem ersten Eintritt wird er rechtzeitig gebremst. In der Luft läuft er als Physikwarp (bis 4x), und während eine Triebwerkslandung brennt, pausiert er. Der Hitzeschutz (Standard: an) bewahrt verfolgte Booster beim Wiedereintritt vor dem Zerbrechen — deine Rakete bleibt unverändert.
