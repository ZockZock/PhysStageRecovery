PhysStageRecovery
{
    configVersion = 8
    // Visible settings: range, autostaging and powered landing.
    physicsRangeKm = 500
    autoStage = false
    autoStageHeight = 5000
    lastAutoStage = 0
    poweredLanding = false
    landingSpeed = 0.5

    // --- Landing law ------------------------------------------------------------------------
    // Guidance/ flies the descent: it forecasts the rest of the fall and holds a descent-rate
    // profile down to the ground. The target sink rate at touchdown is landingSpeed above; the
    // height above ground where the vertical final phase begins [m] is terminalAltitude.
    terminalAltitude = 50
    // Height AGL where the braking plan aims to reach approximately 10 m/s [10..5000 m].
    // Separate from terminalAltitude, which controls the final attitude/tilt phase.
    captureAltitude = 100
    // How far the booster may lean over while it brakes [deg], and how much of the engines'
    // acceleration is held back for attitude control and spool-up error.
    tiltLimit = 20
    thrustReserve = 0.2
    // Height above ground where the automatic canopies open [100..20000 m].
    chuteHeight = 1000

    // Operational switches are saved immediately, including across game restarts.
    modEnabled = true
    autoRecovery = true
    // The window opens by itself when a stage is taken over. Sidebar / Alt+B always work.
    autoOpenWindow = true

    // Advanced settings: deliberately available only in this file.
    maxBoosters = 8
    autoArm = true
    heatImmune = true
    cameraEnabled = true
    cameraFps = 25
    // Mouse changes are saved on release / shortly after the last zoom input.
    cameraDistance = 65
    cameraHeading = 35
    cameraPitch = 12
    showDiagnostics = false
    maxSinkSpeed = 8
    maxHorizontalSpeed = 3
    maxTotalSpeed = 9
    stableSeconds = 3
    maxAcceleration = 0.75
    maxAngularSpeed = 0.5

    // Freely resizable window; size and position are saved automatically.
    windowWidth = 720
    windowHeight = 720
    windowX = 35
    windowY = 60
}
