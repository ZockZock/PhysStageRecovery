PhysStageRecovery
{
    configVersion = 6
    // Visible settings: range, autostaging and powered landing.
    physicsRangeKm = 500
    autoStage = false
    autoStageHeight = 5000
    lastAutoStage = 0
    poweredLanding = false
    landingSpeed = 0.5

    // --- Predictive landing law ------------------------------------------------------------
    // The law in Guidance/ flies the descent: it forecasts the rest of the fall and holds a
    // descent-rate profile down to the ground. `legacy` puts the ported MechJeb state chain back
    // in charge, so a flight that goes wrong can be repeated the old way without a rebuild.
    //
    // `predictive` plans atmospheric coast followed by the landing burn. `legacy` retains
    // the older MechJeb-derived landing chain for comparison.
    guidanceMode = predictive
    // Sink rate the last metres aim for [m/s], and the height above ground where the vertical
    // final phase begins [m]. These two are what decide how soft the landing is.
    touchdownSpeed = 5
    terminalAltitude = 50
    // Height AGL where the braking plan aims to reach approximately 10 m/s [10..5000 m].
    // Separate from terminalAltitude, which controls the final attitude/tilt phase.
    captureAltitude = 100
    // How far the booster may lean over while it brakes [deg], and how much of the engines'
    // acceleration is held back for attitude control and spool-up error.
    tiltLimit = 20
    thrustReserve = 0.2

    // Operational switches are saved immediately, including across game restarts.
    modEnabled = true
    autoRecovery = true
    // A new flight starts with the window closed. Manual sidebar / Alt+B access always works.
    autoOpenWindow = true

    // Advanced settings: deliberately available only in this file.
    maxBoosters = 8
    autoArm = true
    heatImmune = true
    cameraEnabled = true
    cameraFps = 15
    // Mouse changes are saved on release / shortly after the last zoom input.
    cameraDistance = 65
    cameraHeading = 35
    cameraPitch = 12
    showDiagnostics = false
    maxSinkSpeed = 8
    maxHorizontalSpeed = 3
    maxTotalSpeed = 9
    stableSeconds = 3
    maxAcceleration = 0.75
    maxAngularSpeed = 0.5

    // Freely resizable window; size and position are saved automatically.
    windowWidth = 720
    windowHeight = 720
    windowX = 35
    windowY = 60
}
